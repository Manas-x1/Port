<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 — Page Not Found | Manas Upadhyay</title>
    <link rel="icon" type="image/png" href="/p4.png" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0d0d0f;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .tag {
        font-family: monospace;
        font-size: 11px;
        color: #ff4f2b;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        margin-bottom: 20px;
        padding: 4px 12px;
        border: 1px solid #2d2d33;
        background: #141417;
      }
      h1 {
        font-size: clamp(32px, 6vw, 56px);
        font-weight: 300;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        margin: 0 0 16px 0;
      }
      p {
        color: #8a8a93;
        font-family: monospace;
        font-size: 13px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 32px;
      }
      a {
        display: inline-block;
        padding: 12px 28px;
        background-color: #ff4f2b;
        color: #0d0d0f;
        font-family: monospace;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        transition: opacity 0.2s;
      }
      a:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="tag">ERROR 404 // UNRESOLVED ROUTE</div>
    <h1>Lost in Latent Space</h1>
    <p>The requested page could not be found.</p>
    <a href="/">Return to Index</a>
  </body>
</html>
